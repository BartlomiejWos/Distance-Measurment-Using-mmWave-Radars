[mypy]
python_version = 3.12
strict = True
warn_return_any = True
warn_unused_configs = True

[mypy-src.*]
follow_imports = skip

# dca1000.py uses sys._MEIPASS (runtime-only for PyInstaller) and imports the
# compiled radar_api.pyd — both trigger attr-defined error.
[mypy-hwctl.dca1000.dca1000]
disable_error_code = attr-defined, no-redef

